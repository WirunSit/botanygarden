# เผยแพร่หน้าเว็บขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
#
# - ถ้ายังไม่ได้ตั้งตัวแปร APPS_SCRIPT_URL → สร้างแบบ "โหมดทดลอง" (ข้อมูลตัวอย่างในเบราว์เซอร์)
# - ตั้งตัวแปรที่ Settings → Secrets and variables → Actions → Variables
#     ชื่อ APPS_SCRIPT_URL ค่า https://script.google.com/macros/s/XXXX/exec
#   แล้วกด Run workflow (หรือ push ใหม่) → หน้าเว็บจะเชื่อมกับ Google Sheet ของโรงเรียน
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ]; then
            node tools/build.js --api "$APPS_SCRIPT_URL"
          else
            node tools/build.js --demo
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
